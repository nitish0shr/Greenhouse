[project]
name = "recruiter-autopilot"
version = "1.0.0"
description = "Production-grade Recruiter Autopilot for Greenhouse + Outlook"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Recruiter Autopilot Team"}
]
dependencies = [
    # Web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",

    # Database
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",

    # Redis & Task Queue
    "redis>=5.0.1",
    "celery[redis]>=5.3.6",

    # HTTP Client
    "httpx>=0.26.0",
    "tenacity>=8.2.3",

    # Document parsing
    "pypdf>=3.17.4",
    "python-docx>=1.1.0",
    "pdfplumber>=0.10.3",

    # Data validation & settings
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.1.0",

    # YAML & templating
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",

    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Microsoft Graph
    "msal>=1.26.0",

    # Utilities
    "structlog>=24.1.0",
    "python-dateutil>=2.8.2",
    "orjson>=3.9.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "respx>=0.20.2",
    "faker>=22.2.0",
    "factory-boy>=3.3.0",
    "ruff>=0.1.13",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
